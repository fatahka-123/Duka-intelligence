name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: duka, POSTGRES_PASSWORD: duka, POSTGRES_DB: duka }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite
        run: pytest -q
      - name: Migrations + tests on PostgreSQL
        env:
          DATABASE_URL: postgresql://duka:duka@localhost:5432/duka
          AUTO_CREATE_TABLES: "false"
          DUKA_SECRET_KEY: ci-only-secret-key-that-is-long-enough-1234567890
        run: |
          alembic upgrade head
          alembic check
          pytest -q
