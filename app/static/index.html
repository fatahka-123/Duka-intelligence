<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10251d">
  <meta name="description" content="Duka Intelligence — smarter retail operations and business insights.">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <title>Duka Intelligence</title>
  <script>/* apply the saved theme before first paint, so there is no white flash */
    (function () { var t = 'light'; try { t = JSON.parse(localStorage.getItem('duka_theme')) || 'light'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t; })();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=0.4.1">
</head>
<body>
  <div id="root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <script src="/static/app.js?v=0.4.1"></script>
  <script src="/static/smart.js?v=0.4.1"></script>
</body>
